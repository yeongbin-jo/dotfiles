# ============================================================
#  ~/.tmux.conf  —  chezmoi 관리 (3대 Mac 공통)
# ============================================================

# ── 기본 ──
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features "*:cstyle"
set -as terminal-features "xterm-ghostty:RGB"      # truecolor (24bit)

# ── sane defaults (tmux-sensible 핵심 인라인) ──
set -sg escape-time 0           # vi ESC 지연 제거
set -g  focus-events on
setw -g aggressive-resize on
set -g  display-time 2000

# ── 인덱스 / 히스토리 ──
set -g  base-index 1            # 창 번호 1부터
setw -g pane-base-index 1       # 패널 번호 1부터
set -g  renumber-windows on     # 창 닫으면 번호 재정렬
set -g  history-limit 50000     # 스크롤백 5만 줄

# ── 직관적 분할 + 현재 경로 유지 ──
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ── 설정 리로드 (prefix r) ──
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded ✓"

# ── 창 이름 = git 브랜치 (main/master 면 프로젝트명, claude 타이틀 대신) ──
set -g  allow-rename off          # 프로그램(claude)의 OSC 타이틀 변경 무시
setw -g automatic-rename on
setw -g automatic-rename-format '#(p="#{pane_current_path}"; b=$(git -C "$p" branch --show-current 2>/dev/null); case "$b" in ""|main|master) basename "$(git -C "$p" rev-parse --show-toplevel 2>/dev/null || echo "$p")";; *) echo "$b";; esac)'

# ============================================================
#  상태바 — 위쪽 + Catppuccin Mocha 색감
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "

set -g status-right-length 80
set -g status-right "#[fg=#f9e2af]#{?client_prefix,● ,}#[fg=#a6adc8]#h #[fg=#6c7086]│ #[fg=#89b4fa]%m-%d #[fg=#cdd6f4]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#a6e3a1,bold] #I #W "

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style            "bg=#89b4fa,fg=#1e1e2e,bold"
