# ============================================================
#  ~/.tmux.conf  —  chezmoi 관리 (3대 Mac 공통)
# ============================================================

# ── 기본 ──
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features "*:cstyle"
set -as terminal-features "xterm-ghostty:RGB"      # truecolor (24bit)

# ── sane defaults (tmux-sensible 핵심 인라인) ──
set -sg escape-time 0           # vi ESC 지연 제거
set -g  focus-events on
setw -g aggressive-resize on
set -g  display-time 2000

# ── 인덱스 / 히스토리 ──
set -g  base-index 1            # 창 번호 1부터
setw -g pane-base-index 1       # 패널 번호 1부터
set -g  renumber-windows on     # 창 닫으면 번호 재정렬
set -g  history-limit 50000     # 스크롤백 5만 줄

# ── 직관적 분할 + 현재 경로 유지 ──
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ── Option(Alt)+숫자 = 창 바로 이동 (prefix 없이) ──
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── 설정 리로드 (prefix r) ──
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded ✓"

# ── 창 이름 = git 브랜치 (main/master 면 프로젝트명, claude 타이틀 대신) ──
set -g  allow-rename off          # 프로그램(claude)의 OSC 타이틀 변경 무시
setw -g automatic-rename on
setw -g automatic-rename-format '#(p="#{pane_current_path}"; b=$(git -C "$p" branch --show-current 2>/dev/null); if [ -z "$b" ] || [ "$b" = main ] || [ "$b" = master ]; then basename "$(git -C "$p" rev-parse --show-toplevel 2>/dev/null || echo "$p")"; else echo "$b"; fi)'

# ============================================================
#  상태바 — 위쪽 + Catppuccin Latte 색감 (라이트)
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#eff1f5,fg=#4c4f69"

set -g status-left-length 40
set -g status-left "#[bg=#1e66f5,fg=#eff1f5,bold] #S #[bg=#eff1f5] "

set -g status-right-length 80
set -g status-right "#[fg=#df8e1d]#{?client_prefix,● ,}#[fg=#6c6f85]#h #[fg=#9ca0b0]│ #[fg=#1e66f5]%m-%d #[fg=#4c4f69]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#8c8fa1] #I #W "
setw -g window-status-current-format "#[bg=#ccd0da,fg=#40a02b,bold] #I #W "

set -g pane-border-style        "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style            "bg=#1e66f5,fg=#eff1f5,bold"
